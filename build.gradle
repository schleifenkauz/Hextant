buildscript {
    dependencies {
        classpath 'org.jetbrains.dokka:dokka-gradle-plugin:0.9.17'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
    id 'org.jetbrains.kotlin.plugin.serialization' version "2.1.0" apply false
    id 'com.gradle.plugin-publish' version '1.3.0' apply false
    id 'org.openjfx.javafxplugin' version '0.1.0' apply false
}

repositories {
    mavenCentral()
}

allprojects {
    group = 'de.schleifenkauz'
}

tasks.register('initialSetup') {
    group = "build setup"
    doLast {
        File launcher = new File(System.getProperty("user.home") + "/hextant" + "/launcher")
        println(launcher)
        launcher.mkdirs()
        File info = new File(launcher, "project.json")
        String contents = new String(new File(rootDir, "setup/launcher-info.json").readBytes())
        info.write(contents)
    }
}

subprojects {
    repositories {
        mavenCentral()
        maven {
            url = uri("https://central.sonatype.com/repository/maven-snapshots/")
        }
    }

    apply plugin: 'kotlin'

    kotlin {
        jvmToolchain(Integer.parseInt(findProperty("jdk_version") as String))
    }

    compileKotlin {
        kotlinOptions.freeCompilerArgs += '-opt-in=kotlin.RequiresOptIn'
    }
}